name: Source and Jacobian checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-core.txt
      - run: python scripts/verify_repository.py
      - run: python search/check_jacobian.py
