name: Hollow parts inspection
on:
  pull_request:
  workflow_dispatch:
jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r hollow/requirements.txt
      - run: python scripts/restore_assets.py
      - run: python hollow/inspect_viewer.py --screen --legs --replay
