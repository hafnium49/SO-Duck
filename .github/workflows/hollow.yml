name: Hollow parts inspection
on:
  pull_request:
  workflow_dispatch:
jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r crosswise/requirements.txt
      - run: python scripts/restore_assets.py
      - run: python collision/build_bvh.py
      - run: python hollow/inspect_viewer.py --screen --legs --replay
      - run: python hollow/postures.py
