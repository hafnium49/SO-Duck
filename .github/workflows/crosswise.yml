name: Crosswise arm replay
on:
  pull_request:
  workflow_dispatch:
jobs:
  geometry:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r crosswise/requirements.txt
      - run: python scripts/restore_assets.py
      - run: python collision/build_bvh.py
      - run: python crosswise/verify.py
      - run: python crosswise/targets.py "$RUNNER_TEMP/crosswise-targets.csv"
