name: Study integrity
on:
  push:
  pull_request:
jobs:
  inventory-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore lossless binary assets
        run: python scripts/restore_assets.py
      - name: Verify source hashes, presence, schema and Python syntax (not physics)
        run: python scripts/verify_study.py
